name: Pull Request

on:
  workflow_call:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        id: validate
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .+$"

          if [[ $PR_TITLE =~ $PATTERN ]]; then
            echo "is_valid=true" >> $GITHUB_OUTPUT
          else
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "❌ PR title does not match semantic commit pattern"
            echo "Expected format: type(optional-scope): description"
            echo "Examples:"
            echo "  feat: add new feature"
            echo "  fix(api): handle edge case"
            echo "  docs: update readme"
            exit 1
          fi

      - name: Confirm valid PR Title
        if: steps.validate.outputs.is_valid == 'true'
        run: |
          echo "✅ PR title matches semantic commit pattern"
          echo "Title: ${{ github.event.pull_request.title }}"

  setup-labels:
    needs: validate-title  # This ensures this job only runs if validate-title succeeds
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Parse PR Title
        id: parse
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          COMMIT_TYPE=$(echo "$PR_TITLE" | sed -E 's/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?: .*/\1/')
          echo "type=$COMMIT_TYPE" >> $GITHUB_OUTPUT
          
          # Map semantic types to GitHub default labels
          case $COMMIT_TYPE in
            "fix") LABEL="bug";;
            "docs") LABEL="documentation";;
            "feat") LABEL="enhancement";;
            *) LABEL="";;
          esac
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Add Label to PR
        if: steps.parse.outputs.label != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          LABEL="${{ steps.parse.outputs.label }}"
          
          # Add label to PR
          gh pr edit "${PR_NUMBER}" \
            --add-label "${LABEL}" \
            --repo "${REPO}"