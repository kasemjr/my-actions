name: Pull Request

on:
  workflow_call:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Format
        id: validate
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .+$"

          if [[ $PR_TITLE =~ $PATTERN ]]; then
            echo "is_valid=true" >> $GITHUB_OUTPUT
          else
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "❌ PR title does not match semantic commit pattern"
            echo "Expected format: type(optional-scope): description"
            echo "Examples:"
            echo "  feat: add new feature"
            echo "  fix(api): handle edge case"
            echo "  docs: update readme"
            exit 1
          fi

      - name: Confirm valid PR Title
        if: steps.validate.outputs.is_valid == 'true'
        run: |
          echo "✅ PR title matches semantic commit pattern"
          echo "Title: ${{ github.event.pull_request.title }}"

  setup-labels:
    needs: validate-title  # This ensures this job only runs if validate-title succeeds
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Parse PR Title
        id: parse
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          COMMIT_TYPE=$(echo "$PR_TITLE" | sed -E 's/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?: .*/\1/')
          echo "type=$COMMIT_TYPE" >> $GITHUB_OUTPUT
          
          # Map commit type to label color
          case $COMMIT_TYPE in
            "feat") COLOR="0E8A16";;
            "fix") COLOR="D93F0B";;
            "docs") COLOR="0075CA";;
            "style") COLOR="BFD4F2";;
            "refactor") COLOR="FBCA04";;
            "perf") COLOR="7057FF";;
            "test") COLOR="006B75";;
            "build") COLOR="B60205";;
            "ci") COLOR="1D76DB";;
            "chore") COLOR="C2E0C6";;
            "revert") COLOR="FF0000";;
          esac
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Add Label to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          TYPE="${{ steps.parse.outputs.type }}"
          COLOR="${{ steps.parse.outputs.color }}"
          LABEL_NAME="type: ${TYPE}"
          
          # Create label if it doesn't exist
          gh label create "${LABEL_NAME}" \
            --color "${COLOR}" \
            --description "PR type: ${TYPE}" \
            --repo "${REPO}" || true
          
          # Add label to PR
          gh pr edit "${PR_NUMBER}" \
            --add-label "${LABEL_NAME}" \
            --repo "${REPO}"